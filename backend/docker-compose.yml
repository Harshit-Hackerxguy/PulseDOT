services:
  # PostgreSQL database
  db:
    image: postgres:15-alpine
    container_name: spotify_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: spotify_clone
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs only when the volume is empty. The API also applies schema.sql on boot.
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d spotify_clone"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - spotify_network

  # Node.js / Express API
  api:
    build: .
    container_name: spotify_api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: development
      # Inside Docker the hostname is the service name "db", NOT localhost.
      DATABASE_URL: postgresql://postgres:password@db:5432/spotify_clone
      JWT_SECRET: super_secret_jwt_key_change_me
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:5173
    volumes:
      # Live-reload: tsx watch picks up edits made on the host.
      - ./src:/app/src
      - ./schema.sql:/app/schema.sql:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - spotify_network

volumes:
  pgdata:

networks:
  spotify_network:
    driver: bridge
